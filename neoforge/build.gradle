plugins {
    id "net.neoforged.moddev"
}

base.archivesName = "${rootProject.archives_base_name}-mc${minecraft_version}-neoforge"

sourceSets {
    main {
        java.setSrcDirs(["../common/src/main/java", "src/main/java"])
        resources.setSrcDirs(["../common/src/main/resources", "src/main/resources"])
    }
    test.java.srcDir("../common/src/test/java")
}

neoForge {
    enable {
        version = neoforge_version
        // 26.x ships an unobfuscated development jar; avoid a needless
        // decompile/recompile pipeline and keep CI deterministic.
        disableRecompilation = true
    }
    mods {
        caramelchat { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            def preference = System.getProperty("caramelchat.preferNativeWayland")
            if (preference != null) {
                jvmArgument "-Dcaramelchat.preferNativeWayland=${preference}"
            }
        }
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.1"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
