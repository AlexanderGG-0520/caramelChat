plugins {
    id "net.fabricmc.fabric-loom"
}

base.archivesName = "${rootProject.archives_base_name}-mc${minecraft_version}-fabric"

sourceSets {
    main {
        java.setSrcDirs(["../common/src/main/java", "src/main/java"])
        resources.setSrcDirs(["../common/src/main/resources", "src/main/resources"])
    }
    test.java.srcDir("../common/src/test/java")
}

loom {
    runs {
        client {
            def preference = System.getProperty("caramelchat.preferNativeWayland")
            if (preference != null) {
                vmArg "-Dcaramelchat.preferNativeWayland=${preference}"
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.1"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
